apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ridego
  namespace: argocd
spec:
  description: RideGo microservices platform

  sourceRepos:
    - https://github.com/orinameh/ridego

  destinations:
    - namespace: ridego
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"