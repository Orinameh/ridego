# Weekly Go module bumps, batched into a SINGLE PR.
#
# Cost control: every PR runs the full CI matrix (go + 6 docker builds +
# manifests + tofu ≈ 25-35 billed minutes). One `groups` name across all
# directories collapses the whole weekly batch into one PR.
#
# Deliberately gomod-only: Dependabot cannot combine ecosystems, so watching
# docker + github-actions too would mean 3 PRs minimum. The Golang base
# image and the handful of action pins change rarely — bump those by hand
# when needed (docker: edit the FROM line in services/*/Dockerfile;
# actions: edit .github/workflows/*.yaml; CI validates both).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /pkg
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /proto
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: gomod
