apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: ridego
  labels:
    app: nats
spec:
  replicas: 1 # single-node for this project; cluster mode is a later upgrade
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          args: ["-m", "8222"] # enables NATS HTTP monitoring endpoint
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: ridego
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222