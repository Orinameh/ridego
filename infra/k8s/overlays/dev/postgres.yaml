# Single-node Postgres for local development (kind/minikube).
# Prod uses RDS (see infra/tofu/modules/rds) — this exists only so the dev
# overlay is self-contained. One instance, three databases (one per service).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: ridego
data:
  init.sql: |
    CREATE DATABASE ridego_users_db;
    CREATE DATABASE ridego_trips_db;
    CREATE DATABASE ridego_payment_db;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ridego
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ridego
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
