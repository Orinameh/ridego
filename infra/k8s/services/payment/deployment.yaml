apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ridego
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/orinameh/ridego-payment:latest # placeholder until the first rel-* release pins a sha-* tag (see Publish workflow)
          ports:
            - name: http
              containerPort: 6005
          envFrom:
            - secretRef:
                name: payment-service-secrets
            - configMapRef:
                name: ridego-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ridego
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 6005
      targetPort: 6005
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: ridego
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70