apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: ridego
  labels:
    app: matching-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: matching-service
          image: ghcr.io/orinameh/ridego-matching-service:latest
          ports:
            - name: http
              containerPort: 6004
          env:
            # In-cluster DNS — overrides the .env defaults used in local dev
            - name: LOCATION_GRPC_ADDR
              value: "location-service.ridego.svc.cluster.local:50051"
            - name: TRIP_SERVICE_ADDR
              value: "trip-service.ridego.svc.cluster.local:6002"
          envFrom:
            - secretRef:
                name: matching-service-secrets
            - configMapRef:
                name: ridego-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6004
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6004
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: ridego
spec:
  selector:
    app: matching-service
  ports:
    - name: http
      port: 6004
      targetPort: 6004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-service-hpa
  namespace: ridego
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70