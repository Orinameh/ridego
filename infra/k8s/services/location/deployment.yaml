apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: ridego
  labels:
    app: location-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: location-service
          image: ghcr.io/orinameh/ridego-location:latest # placeholder until the first rel-* release pins a sha-* tag (see Publish workflow)
          ports:
            - name: http
              containerPort: 6003
            - name: grpc
              containerPort: 50051
          envFrom:
            - secretRef:
                name: location-service-secrets
            - configMapRef:
                name: ridego-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 96Mi
            limits:
              cpu: 600m
              memory: 320Mi
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: ridego
spec:
  selector:
    app: location-service
  ports:
    - name: http
      port: 6003
      targetPort: 6003
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: location-service-hpa
  namespace: ridego
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: location-service
  minReplicas: 2
  maxReplicas: 12 # higher ceiling — WebSocket connections are long-lived
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65